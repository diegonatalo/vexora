<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="490" height="290" viewBox="0 0 490 290" role="img" aria-label="Editor por seções. Um único formulário dividido em seções, com navegação lateral, progresso e validação ao sair do campo. O perfil é salvo a cada edição, mesmo incompleto."><title>Editor por seções. Um único formulário dividido em seções, com navegação lateral, progresso e validação ao sair do campo. O perfil é salvo a cada edição, mesmo incompleto.</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#46c79b"/><stop offset="1" stop-color="#9be3c8"/></linearGradient><radialGradient id="fc" gradientUnits="userSpaceOnUse" cx="490" cy="0" r="220"><stop offset="0" stop-color="#46c79b" stop-opacity="0.18"/><stop offset="1" stop-color="#46c79b" stop-opacity="0"/></radialGradient><clipPath id="fk"><rect width="490" height="290" rx="22"/></clipPath></defs><rect x="0.5" y="0.5" width="489" height="289" rx="22" fill="#15191d" stroke="#3a434b"/><g clip-path="url(#fk)"><rect width="490" height="290" fill="url(#fc)"/><rect width="490" height="4" fill="url(#g)"/></g><text x="32" y="44" font-family="'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="1.4" fill="#7f8791">FUNCIONALIDADE 01</text><text x="32" y="82" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#ecebe6">Editor por seções</text><text x="32" y="116" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" fill="#a4a9b1">Um único formulário dividido em seções, com navegação</text><text x="32" y="138" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" fill="#a4a9b1">lateral, progresso e validação ao sair do campo. O</text><text x="32" y="160" font-family="Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-size="14.5" fill="#a4a9b1">perfil é salvo a cada edição, mesmo incompleto.</text></svg>
